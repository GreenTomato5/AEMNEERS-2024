name: Format With Prettier

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Mid JS Framework
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Clean install
      run: |
        rm -rf node_modules
        npm install

    - name: Apply Prettier
      run: npx prettier --write "**/*.java"

    - name: Check for Changes
      id: git-check
      run: |
        git diff --exit-code || echo "Changes detected"
      continue-on-error: true

    - name: Commit changes
      if: steps.git-check.outcome == 'success'
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add .
        git commit -m 'Apply Prettier format' || echo "No changes to commit"
        # Determine ref for push based on context
        if [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
        else
          git push origin "HEAD"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Notify if no Changes
      if: steps.git-check.outcome == 'failure'
      run: echo "Formatting not Required"
